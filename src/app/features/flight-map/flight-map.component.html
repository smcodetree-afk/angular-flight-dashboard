<div class="map-wrapper">
  <div #mapEl class="map-canvas" role="application" aria-label="Interactive flight tracking map"></div>
  <div class="map-legend" aria-hidden="true">
    <span class="legend-item"><i class="dot active"></i>Active</span>
    <span class="legend-item"><i class="dot delayed"></i>Delayed</span>
    <span class="legend-item"><i class="dot arrived"></i>Arrived</span>
    <span class="legend-item"><i class="dot scheduled"></i>Scheduled</span>
  </div>
</div>
